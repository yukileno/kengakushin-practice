<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>県学診練習</title>
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#1d2733; --sub:#5b6b7c; --line:#d5dee8;
  --main:#2457a6; --main-d:#1a4283; --ok:#1b8a4b; --okbg:#e5f6ec; --ng:#c0392b; --ngbg:#fdeceb; --warn:#9a6b00; --warnbg:#fff4d6;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;line-height:1.6}
#app{max-width:760px;margin:0 auto;padding:16px}
#app.wide{max-width:1180px}
.split{display:flex;gap:18px;align-items:flex-start}
.split>.main{flex:1;min-width:0}
.artbox{flex:0 0 auto;position:sticky;top:12px;text-align:center}
.artbox canvas{display:block;height:min(82vh,720px);width:auto;aspect-ratio:var(--ar);max-width:44vw;background:#fff;border:1px solid var(--line);border-radius:12px}
.artbox .pc{font-size:.85rem;color:var(--sub);margin-top:4px}
@media (max-width:760px){.split{flex-direction:column}.artbox{position:static;order:2;align-self:center}.artbox canvas{height:240px;max-width:100%}}
h1{font-size:1.25rem;margin:8px 0 12px}
h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--main);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--main);font-size:1rem;padding:8px 16px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--main);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;cursor:pointer;font-size:.95rem;font-family:inherit;color:var(--ink)}
.chip.on{border-color:var(--main);background:#e8f0fc;color:var(--main-d);font-weight:700}
button.primary{background:var(--main);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:1.1rem;cursor:pointer;font-family:inherit}
button.primary:hover{background:var(--main-d)}
button.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.9rem;cursor:pointer;font-family:inherit}
.small{font-size:.85rem;color:var(--sub)}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem;margin-bottom:6px}
.bar{height:10px;background:#e4ebf3;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;background:var(--main);transition:width .25s}
.q{font-size:1.45rem;line-height:2;margin:6px 0 14px;word-break:break-word}
.fig{margin:0 0 14px;color:var(--ink)}
.homewrap{text-align:center;padding-top:6vh}
.tmode{display:inline-block;background:#fff7d6;border:2px solid #e0b300;border-radius:999px;padding:4px 14px;margin:0 0 10px;font-size:.85rem}
.update-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1e293b;color:#fff;border:2px solid #fde047;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-weight:700}
.update-bar button{padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit}
.lead{font-size:1.1rem;color:var(--sub);margin:0 0 22px}
.bigbtns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.bigbtn{width:min(44vw,260px);min-width:150px;aspect-ratio:1/0.8;border:0;border-radius:22px;background:var(--main);color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--main-d)}
.bigbtn{aspect-ratio:auto;padding:12px 10px 14px}
.bigbtn span{font-size:2.4rem;font-weight:700;line-height:1.2}
.bigbtn canvas.mini{height:150px;width:auto;aspect-ratio:var(--ar);background:#fff;border-radius:10px}
.bigbtn small.pc{font-weight:700;opacity:1}
#app:has(.homewrap){max-width:1180px}
.cats{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.cat{flex:0 1 auto;min-width:0}
.cat .bigbtns{margin-bottom:8px}
.cath{margin:0 0 8px;font-size:1.05rem;color:#fff;border-radius:999px;padding:2px 18px;display:inline-block}
.cath.k1{background:#2457a6}.cath.k2{background:#6b46a8}.cath.k3{background:#0f766e}
.bigbtn.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed;box-shadow:none}
.bigbtn span.long{font-size:1.25rem;line-height:1.3;text-align:center}
.bigbtn small.lk{font-size:.8rem;line-height:1.35;max-width:14em}
@media (min-width:1000px){.bigbtns .bigbtn{width:200px;min-width:0}.bigbtn canvas.mini{height:190px}.bigbtn span{font-size:1.9rem}}
.doneRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.doneBtn{font:inherit;font-size:.95rem;padding:6px 14px;border:2px solid #e0a800;background:#fff8dc;color:#7a5a00;border-radius:999px;cursor:pointer}
#cele{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#2b3a8c,#111a45);display:flex;align-items:center;justify-content:center;overflow:auto;animation:cfade .4s}
#cele #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cele .cbox{position:relative;text-align:center;color:#fff;padding:12px 16px;max-width:96vw}
#cele .ctitle{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;background:linear-gradient(90deg,#ff4d6d,#ffb703,#80ed99,#4cc9f0,#c77dff,#ff4d6d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 2.5s linear infinite,pop .8s cubic-bezier(.2,1.6,.4,1)}
#cele .csub{font-size:clamp(1.1rem,3vw,1.6rem);margin:4px 0 10px}
#cele canvas#cart{height:min(52vh,460px);width:auto;aspect-ratio:var(--ar);max-width:90vw;background:#fff;border-radius:14px;box-shadow:0 0 0 4px #ffd166,0 0 40px 10px rgba(255,209,102,.7);animation:glow 1.4s ease-in-out infinite alternate}
#cele .cunlock{margin-top:10px;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:800;color:#fff;background:linear-gradient(90deg,#ff4d6d,#ffb703);padding:6px 16px;border-radius:999px;display:inline-block;animation:pop .8s .6s both cubic-bezier(.2,1.6,.4,1)}
#cele .cdate{margin-top:8px;font-size:1.1rem;opacity:.9}
#cele .cmsg{font-size:1.2rem;font-weight:700;color:#ffd166;margin:2px 0 10px}
@keyframes cfade{from{opacity:0}to{opacity:1}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{box-shadow:0 0 0 4px #ffd166,0 0 20px 4px rgba(255,209,102,.5)}to{box-shadow:0 0 0 4px #fff,0 0 60px 18px rgba(255,209,102,.95)}}
@media (prefers-reduced-motion:reduce){#cele .ctitle,#cele canvas#cart{animation:none}}
.bigbtn small{font-size:.85rem;opacity:.9}
.bigbtn.soc{background:#2a8a5a;box-shadow:0 4px 0 #1c6a42}
.bigbtn.kok{background:#b4532a;box-shadow:0 4px 0 #8a3d1c}
.bigbtn:active{transform:translateY(3px);box-shadow:none}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
button.choice{text-align:left;background:#fff;color:var(--ink);border:2px solid var(--main);border-radius:12px;padding:12px 16px;font-size:1.2rem;line-height:1.5;cursor:pointer;font-family:inherit}
button.choice:hover{background:#e8f0fc}
button.choice:active{background:#d6e4fa}
.tag{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:.8rem;margin-left:6px}
.foot{margin-top:40px}

.inrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.ans{font-size:1.5rem;padding:10px 14px;border:2px solid var(--main);border-radius:10px;width:min(100%,360px);font-family:inherit}
input.ans:disabled{background:#eef2f7;border-color:var(--line)}
.unit{font-size:1.3rem}
.hint{font-size:.85rem;color:var(--sub);margin-top:8px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:1.05rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.ng{background:var(--ngbg);color:var(--ng)}
.fb.fmt{background:var(--warnbg);color:var(--warn)}
.fb .ansline{font-size:1.4rem;font-weight:700;color:var(--ink);margin:6px 0}
.fb .exp{font-size:.92rem;color:var(--ink);margin-top:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.15;font-size:.95em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.mx{font-size:1.15em;margin-right:.05em}
.kb{margin-top:12px;max-width:560px}
.kb .rows{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:rtl}
.kb .rows button{direction:ltr;font:inherit;font-size:1.15rem;padding:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
.kb .rows button:active{background:#e3ecf8}
.kb .rows .sp{visibility:hidden}
.kb .tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kb .tools button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#f4f6fa;color:var(--ink);cursor:pointer}
input.ans[readonly]{caret-color:transparent}
.fin{display:inline-flex;align-items:center;gap:10px;vertical-align:middle;flex-wrap:wrap}
.fin input{font-size:1.5rem;padding:8px 4px;border:2px solid var(--main);border-radius:10px;text-align:center;font-family:inherit;width:3.4em}
.fin input:disabled{background:#eef2f7;border-color:var(--line)}
.fin .st{display:inline-flex;flex-direction:column;align-items:center;gap:5px}
.fin .bar{width:100%;border-top:3px solid currentColor}
.fin .wh{display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--sub,#667)}
.fin .wh input{width:3em}
.fin .lb{font-size:.75rem;color:var(--sub,#667)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--sub);font-weight:600;font-size:.85rem}
.meter{display:inline-block;width:90px;height:8px;background:#e4ebf3;border-radius:5px;vertical-align:middle;margin-right:6px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok)}
.big{font-size:2rem;font-weight:700;color:var(--main)}
ul.miss{padding-left:1.2em;margin:6px 0}
ul.miss li{margin-bottom:8px}
.bigbtn.shr{background:#6b46a8;box-shadow:0 4px 0 #4f3380}
.q.sm{font-size:1.15rem;line-height:1.8}
.choices.long button.choice{font-size:1rem}
.fig .intro{margin:0 0 6px}
.pas{border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px;background:#fcfcfd;font-size:1.02rem;line-height:1.9}
.pas h3{font-size:1rem;margin:0 0 6px}
.pas p{margin:4px 0}
.shiryo{border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;background:#fcfcfd}
.shiryo h3{font-size:.95rem;margin:0 0 4px}
.shiryo p{margin:4px 0}
.shiryo svg{max-width:100%;height:auto;display:block}
.shiryo svg text{fill:#1d2733;font-family:inherit}
.talk{background:#eef5fb;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.95rem}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:4px 8px;text-align:center;color:var(--ink);font-size:.95rem;font-weight:400}
table.t th{background:#eef1f5;font-weight:600}
.legend{display:flex;gap:14px;font-size:.85rem;flex-wrap:wrap;margin-top:2px}
.legend i{display:inline-block;width:24px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.bigbtn.jk{background:#0f766e;box-shadow:0 4px 0 #0b524c}
.jk-steps{display:flex;gap:6px;margin:6px 0 12px}
.jk-steps div{flex:1;text-align:center;font-size:.85rem;padding:6px 2px;border-radius:8px;background:#e4ebf3;color:var(--sub)}
.jk-steps div.on{background:var(--main);color:#fff;font-weight:700}
.jk-steps div.done{background:var(--okbg);color:var(--ok)}
.jk-instr{font-weight:700;margin:2px 0 10px}
.jk-line{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.jk-av{font-size:1.3rem;line-height:1.4}
.jk-tx{flex:1}
.jk-who{font-size:.8rem;color:var(--sub)}
.jk-line.mk{background:#fff176;border-color:#e0c200}
.jk-line.good,.jk-chip.good{background:var(--okbg);border-color:var(--ok)}
.jk-line.bad,.jk-chip.bad{background:var(--ngbg);border-color:var(--ng)}
.jk-line.miss,.jk-chip.miss{border-color:var(--warn);border-style:dashed}
.jk-badge{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;margin-left:6px}
.jk-chips{display:flex;flex-direction:column;gap:8px}
.jk-chip{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:inherit;color:var(--ink);cursor:pointer}
.jk-chip.sel{background:#e8f0fc;border-color:var(--main)}
.jk-why{display:block;font-size:.85rem;margin-top:2px}
.jk-gh{font-weight:700;margin:10px 0 6px;font-size:.95rem}
.jk-fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.jk-fb.ok{background:var(--okbg);color:var(--ok)}
.jk-fb.ng{background:var(--ngbg);color:var(--ng)}
.jk-fb.warn{background:var(--warnbg);color:var(--warn)}
.jk-sent{line-height:2.4;font-size:1.05rem}
.jk-sent select{font:inherit;font-size:.95rem;max-width:100%;padding:4px 6px;border:2px solid var(--main);border-radius:8px;background:#fff;color:var(--ink);margin:2px 2px;vertical-align:middle}
.jk-sent select.ok{border-color:var(--ok);background:var(--okbg)}
.jk-sent select.ng{border-color:var(--ng);background:var(--ngbg)}
.jk-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.jk-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.jk-item:hover{border-color:var(--main)}
.jk-sub{display:inline-block;background:#0f766e;color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:8px}
@media (max-width:520px){ .q{font-size:1.25rem} input.ans{font-size:1.3rem} }
</style>

<body>
<div id="app"></div>

<script src="data/math.js"></script>
<script src="data/social.js"></script>
<script src="data/kokugo.js"></script>
<script src="data/yomi.js"></script>
<script src="data/shiryo.js"></script>
<script src="data/jikkuri.js"></script>
<script src="data/art.js"></script>
<script>
'use strict';
/* ---------- 判定 ---------- */
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function normText(s, easy) {
  let t = String(s).normalize('NFKC').replace(/[\s　。、．，.,・「」『』()（）]/g, '').replace(/^約/, '');
  if (easy) t = kata2hira(t);
  return t.toLowerCase();
}
function parseDec(raw) {
  const s = String(raw).normalize('NFKC').replace(/[\s,]/g, '');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  const m = s.match(/^(-?)(\d*)\.?(\d*)$/);
  return { n: (m[1] ? -1 : 1) * parseInt((m[2] || '0') + (m[3] || ''), 10), scale: (m[3] || '').length };
}
function parseFrac(raw) {
  let s = String(raw).normalize('NFKC').trim().replace(/と/g, ' ').replace(/\s+/g, ' ').trim();
  let m;
  if ((m = s.match(/^(\d+)$/))) return { w: +m[1], n: 0, d: 1, whole: true };
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return { w: 0, n: +m[1], d: +m[2], mixed: false };
  if ((m = s.match(/^(\d+) (\d+)\/(\d+)$/))) return { w: +m[1], n: +m[2], d: +m[3], mixed: true };
  return null;
}
/* ---------- 分数の入力枠（整数・分子・分母） ---------- */
function fracBox(p, v) {
  v = v || {};
  const f = (id, val, lab) => `<input id="${p}${id}" class="fi" inputmode="numeric" autocomplete="off" value="${esc(val || '')}" aria-label="${lab}">`;
  return `<span class="fin"><span class="wh">${f('w', v.w, '整数')}<span>整数<br>（帯分数のとき）</span></span>
    <span class="st">${f('n', v.n, '分子')}<span class="bar"></span>${f('d', v.d, '分母')}</span></span>`;
}
function fracRead(p) {
  const g = id => { const e = $('#' + p + id); return e ? e.value.normalize('NFKC').replace(/\s/g, '') : ''; };
  const w = g('w'), n = g('n'), d = g('d');
  R.draft = { w, n, d };
  if (![w, n, d].every(x => /^\d*$/.test(x))) return { err: '枠には 数字だけを入れてね。' };
  if (!w && !n && !d) return { s: '' };
  if (!n && !d) return { s: w };                          // 整数だけの答え
  if (!n) return { err: '分子（上の枠）を入れてね。' };
  if (!d) return { err: '分母（下の枠）を入れてね。' };
  return { s: w ? `${w} ${n}/${d}` : `${n}/${d}` };
}
function fracView(s) {
  const p = parseFrac(s);
  if (!p) return esc(s);
  if (p.whole) return `<b style="font-size:1.5rem">${p.w}</b>`;
  return `<span style="font-size:1.4rem">${p.w ? `<span class="mx">${p.w}</span>` : ''}${FR(p.n, p.d)}</span>`;
}
// 戻り値 {st:'ok'|'ng'|'fmt', msg}
function judge(q, raw, easy) {
  const input = String(raw).trim();
  if (!input) return { st: 'fmt', msg: '答えを入力してね。' };
  if (q.kind === 'choice') return { st: q.ans.includes(input) ? 'ok' : 'ng' };
  if (q.kind === 'num') {
    const a = parseDec(input);
    if (!a) return { st: 'fmt', msg: '数字だけで入力してね（単位は書かなくていいよ）。' };
    const b = parseDec(q.ans);
    return { st: a.n * 10 ** b.scale === b.n * 10 ** a.scale ? 'ok' : 'ng' };
  }
  if (q.kind === 'frac') {
    const p = parseFrac(input);
    if (!p || p.d === 0) return { st: 'fmt', msg: '分母は 0 にできないよ。分子（上）と分母（下）を入れてね。' };
    const N = p.w * p.d + p.n, D = p.d;
    if (N * q.ans.d !== q.ans.n * D) return { st: 'ng' };
    if (p.n > 0 && gcd(p.n, p.d) !== 1) return { st: 'fmt', msg: '大きさは合っているよ。約分しよう！' };
    if (p.mixed && p.n >= p.d) return { st: 'fmt', msg: '帯分数の分数部分は、1より小さくしよう。' };
    const ansWhole = q.ans.d === 1 || q.ans.n % q.ans.d === 0;
    if (!ansWhole) {
      if (q.form === 'imp' && p.mixed) return { st: 'fmt', msg: '仮分数（7/3 のような形）で答えよう。' };
      if (q.form === 'mixed' && !p.mixed) return { st: 'fmt', msg: '帯分数（2と1/3 のような形）で答えよう。' };
    }
    return { st: 'ok' };
  }
  // text
  const list = easy ? q.ans.concat(q.alt) : q.ans;
  const x = normText(input, easy);
  return { st: list.some(v => normText(v, easy) === x) ? 'ok' : 'ng' };
}
function showAnswer(q) {
  if (q.kind === 'text' || q.kind === 'choice') return q.ans[0];
  if (q.kind === 'frac') return q.show;
  return q.ans + (q.unit ? ' ' + q.unit : '');
}
function canonical(q) { // うちなおし用の正解（きびしく判定）
  if (q.kind === 'text' || q.kind === 'choice') return q.ans[0];
  if (q.kind === 'frac') return q.show.replace(/（.*$/, '');
  return q.ans;
}

/* ---------- 記録（この端末のブラウザの中だけ） ---------- */
const LS = 'kgk_stats_v1';
function loadStats() {
  try { const o = JSON.parse(localStorage.getItem(LS)) || {}; return { unit: o.unit || {}, q: o.q || {}, g: o.g || {}, pend: o.pend || {}, rd: o.rd || {} }; }
  catch (e) { return { unit: {}, q: {}, g: {}, pend: {}, rd: {} }; }
}

// 開発用：全問題の自己点検（ブラウザのコンソールで selfTest() と打つ。[] なら問題なし）
window.selfTest = function () {
  const bad = [];
  MATH_UNITS.forEach(u => MATH[u].forEach((g, i) => { for (let k = 0; k < 300; k++) {
    const q = g();
    const probe = q.kind === 'frac' ? q.show.replace(/（.*$/, '') : (q.kind === 'choice' || q.kind === 'text') ? q.ans[0] : q.ans;
    if (judge(q, probe, false).st !== 'ok') bad.push([u, i, q.html, probe]);
    if (q.kind === 'text') q.ans.forEach(a => { if (judge(q, a, false).st !== 'ok') bad.push([u, i, q.html, a, 'ans']); });
    if (q.kind === 'choice') {
      if (new Set(q.choices).size !== q.choices.length || q.choices.length < 3 || !q.choices.includes(q.ans[0])) bad.push([u, i, q.html, '選択肢の不備']);
      q.choices.filter(c => c !== q.ans[0]).forEach(c => { if (judge(q, c, false).st !== 'ng') bad.push([u, i, q.html, c, 'wrong-is-ok']); });
    }
    if (q.kind === 'frac' && q.form === 'any' && q.show.includes('（')) { const m = q.show.match(/（(.*)）/)[1]; if (judge(q, m, false).st !== 'ok') bad.push([u, i, 'mixed', m]); }
  } }));
  SOCIAL.forEach(q => {
    q.ans.forEach(a => { if (judge({ kind: q.isNum ? 'num' : 'text', ans: q.isNum ? a : q.ans, alt: q.alt }, a, false).st !== 'ok') bad.push([q.text, a]); });
    q.alt.forEach(a => { if (judge({ kind: 'text', ans: q.ans, alt: q.alt }, a, true).st !== 'ok') bad.push([q.text, a, 'alt']); });
  });
  KOKUGO.forEach(q => {
    const Q = wordQ(q);
    q.ans.forEach(a => { if (judge(Q, a, false).st !== 'ok') bad.push([q.text, a]); });
    if (q.kind === 'choice') {
      if (new Set(q.choices).size !== q.choices.length) bad.push([q.text, '選択肢の重複']);
      if (q.choices.length < 2) bad.push([q.text, '選択肢が足りない']);
      q.choices.filter(c => !q.ans.includes(c)).forEach(c => { if (judge(Q, c, false).st !== 'ng') bad.push([q.text, c, 'wrong-is-ok']); });
    } else q.alt.forEach(a => { if (judge({ kind: 'text', ans: q.ans, alt: q.alt }, a, true).st !== 'ok') bad.push([q.text, a, 'alt']); });
  });
  SHIRYO.forEach(q => {
    const Q = wordQ(q);
    if (q.kind === 'choice') {
      if (new Set(q.choices).size !== q.choices.length) bad.push([q.key, '選択肢の重複']);
      if (q.choices.length < 2 || !q.choices.includes(q.ans[0])) bad.push([q.key, '選択肢の不備']);
      q.choices.filter(c => c !== q.ans[0]).forEach(c => { if (judge(Q, c, false).st !== 'ng') bad.push([q.key, c, 'wrong-is-ok']); });
    }
    q.ans.forEach(a => { if (judge(Q, a, false).st !== 'ok') bad.push([q.key, a, 'right-not-ok']); });
    if (!q.fig) bad.push([q.key, '資料なし']);
  });
  JIKKURI.forEach(p => {
    const k = p.key;
    if (p.s1.lines.filter(l => l[3]).length !== 3) bad.push([k, '大切なセリフは3つ']);
    ['A', 'B'].forEach(g => {
      if (!p.s2[g].some(c => c[1]) || !p.s2[g].some(c => !c[1])) bad.push([k, '資料' + g + 'に、必要なものといらないものの両方が要る']);
      p.s2[g].forEach(c => { if (!c[1] && !c[2]) bad.push([k, 'いらない理由が空']); });
    });
    p.s3.parts.filter(x => x[0] === 's').forEach(x => { if (x[1].length < 3 || new Set(x[1]).size !== x[1].length) bad.push([k, '選択肢の不備']); });
    if (!p.docs() || !p.s2.link || !p.s3.explain) bad.push([k, '資料・まとめ・解説のどれかが空']);
  });
  const keys = SOCIAL.concat(KOKUGO, SHIRYO, JIKKURI).map(q => q.key); if (new Set(keys).size !== keys.length) bad.push(['問題文の重複あり']);
  return bad;
};

function jkStart(i) {
  const p = JIKKURI[i];
  JK = {
    i, p, lines1: jkLines1(p), mistakes: 0, step: 1, mark: new Set(), fb1: null, ev: { A: new Set(), B: new Set() }, fb2: null, fill: {}, fb3: null,
    order: { A: shuffle(p.s2.A.map((_, k) => k)), B: shuffle(p.s2.B.map((_, k) => k)) },
    opts: p.s3.parts.map(x => x[0] === 's' ? shuffle(x[1].map((t, k) => [t, k === 0])) : null)
  };
  window.scrollTo(0, 0); jkRender();
}
function jkRender() {
  const p = JK.p, st = JK;
  const names = ['① 条件をさがす', '② 証拠を集める', '③ 文をつくる'];
  const stepper = `<div class="jk-steps">${names.map((n, i) => `<div class="${st.step === i + 1 ? 'on' : st.step > i + 1 ? 'done' : ''}">${st.step > i + 1 ? '✓ ' : ''}${n}</div>`).join('')}</div>`;
  const body = st.step === 1 ? jkStep1() : st.step === 2 ? jkStep2() : jkStep3();
  app.innerHTML = `${stepper}<div class="card"><h2><span class="jk-sub">${esc(p.unit)}</span>${esc(p.title)}</h2><p class="small" style="margin:0 0 4px">${esc(p.sub)}</p>${p.docs()}</div><div class="card">${body}</div>
    <div class="row"><button class="ghost" id="jkquit">おわる（一覧へ）</button>${skipOn() ? '<button class="ghost" id="jkskip">スキップ（先生用）</button>' : ''}</div>`;
  jkBind();
}
function jkStep1() {
  const p = JK.p, st = JK, fb = st.fb1;
  const items = st.lines1.map((l, i) => {
    let cls = 'jk-line';
    if (fb) { const isT = !!l[3], mk = st.mark.has(i); cls += fb.ok ? (isT ? ' good' : '') : (mk && isT ? ' good' : mk && !isT ? ' bad' : (!mk && isT ? ' miss' : '')); }
    else if (st.mark.has(i)) cls += ' mk';
    const badge = fb && fb.ok && l[3] ? `<span class="jk-badge">${esc(l[3])}</span>` : '';
    return `<button class="${cls}" data-l="${i}" ${fb && fb.ok ? 'disabled' : ''}><span class="jk-av">${l[1]}</span><span class="jk-tx"><span class="jk-who">${esc(l[0])}</span><br>${esc(l[2])}${badge}</span></button>`;
  }).join('');
  let msg = '';
  if (fb) msg = fb.ok ? '<div class="jk-fb ok"><b>○ 条件が3つそろったね！</b> 使う資料、話す内容、書き方のルールを確かめてから、資料を読むと、まよわないよ。</div>'
    : `<div class="jk-fb warn">${fb.extra ? '大切ではないセリフがまざっているよ（赤いところ）。' : ''}${fb.missing ? 'まだ見つけていない大切なセリフがあるよ（点線のところ）。' : ''}もう一度、えらびなおしてみよう。</div>`;
  return `<div class="jk-instr">${esc(p.s1.instr)}</div>${items}${msg}
    <div class="jk-row">${fb && fb.ok ? '<button class="primary" id="jknext">② 証拠を集めに行く →</button>' : `<button class="primary" id="jkchk1" ${st.mark.size ? '' : 'disabled'}>これでマーカーを引いた！</button>`}</div>
    <p class="small">（大切なセリフは ${st.lines1.filter(l => l[3]).length} つ）</p>`;
}
function jkStep2() {
  const p = JK.p, st = JK, fb = st.fb2;
  const grp = g => `<div class="jk-gh">資料${g}から</div><div class="jk-chips">${st.order[g].map(i => {
    const c = p.s2[g][i], ok = !!c[1], sel = st.ev[g].has(i);
    let cls = 'jk-chip';
    if (fb) cls += sel ? (ok ? ' good' : ' bad') : (ok && !fb.ok ? ' miss' : ''); else if (sel) cls += ' sel';
    const why = fb && sel && !ok ? `<span class="jk-why">${esc(c[2])}</span>` : (fb && !sel && ok && !fb.ok ? '<span class="jk-why">これも、必要だよ。</span>' : '');
    return `<button class="${cls}" data-g="${g}" data-i="${i}" ${fb && fb.ok ? 'disabled' : ''}>${sel ? '✔ ' : ''}${esc(c[0])}${why}</button>`;
  }).join('')}</div>`;
  let msg = '';
  if (fb) msg = fb.ok ? `<div class="jk-fb ok"><b>○ 証拠がそろったよ！</b><br>${esc(p.s2.link)}</div>`
    : `<div class="jk-fb warn">${fb.wrong ? '関係のうすいもの（赤）がまざっているよ。' : ''}${fb.missing ? '必要なもの（点線）が、まだ足りないよ。' : ''}選びなおしてみよう。</div>`;
  const n = st.ev.A.size + st.ev.B.size;
  return `<div class="jk-instr">${esc(p.s2.instr)}</div>${grp('A')}${grp('B')}${msg}
    <div class="jk-row">${fb && fb.ok ? '<button class="primary" id="jknext">③ 文をつくりに行く →</button>' : `<button class="primary" id="jkchk2" ${n ? '' : 'disabled'}>これで証拠を集めた！</button>`}<button class="ghost" id="jkback">← もどる</button></div>`;
}
function jkStep3() {
  const p = JK.p, st = JK, fb = st.fb3;
  let si = 0;
  const sent = p.s3.parts.map((x, k) => {
    if (x[0] === 't') return esc(x[1]);
    const id = 's' + (si++), v = st.fill[id];
    const cls = fb ? (fb.res[id] ? 'ok' : 'ng') : '';
    return `<select data-id="${id}" class="${cls}" ${fb && fb.allOk ? 'disabled' : ''}><option value="">▼ えらぶ</option>${st.opts[k].map(([t], j) => `<option value="${j}" ${v === String(j) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${fb ? (fb.res[id] ? '✅' : '❌') : ''}`;
  }).join('');
  let msg = '';
  if (fb) msg = fb.allOk ? `<div class="jk-fb ok"><b>${st.mistakes === 0 ? '◎ 1回でできた！' : '○ 完成！'}</b><br>${esc(p.s3.explain)}</div>`
    : `<div class="jk-fb ng">${fb.empty ? 'まだ、えらんでいないところがあるよ。' : '❌のところが、資料とちがうよ。②で集めた証拠を見て、もう一度えらぼう。'}</div>`;
  const last = JK.i === JIKKURI.length - 1;
  return `<div class="jk-instr">${esc(p.s3.lead)}</div><div class="jk-sent">${sent}</div>${msg}
    <div class="jk-row">${fb && fb.allOk ? `<button class="primary" id="jknextp">${last ? '一覧にもどる' : 'つぎの問題へ →'}</button><button class="ghost" id="jkagain">もう一度やる</button>` : '<button class="primary" id="jkchk3">答えあわせ</button><button class="ghost" id="jkback">← もどる</button>'}</div>`;
}
function jkBind() {
  const p = JK.p, st = JK;
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  const miss = () => { st.mistakes++; };
  document.querySelectorAll('.jk-line[data-l]').forEach(b => b.onclick = () => { const i = +b.dataset.l; st.fb1 = null; st.mark.has(i) ? st.mark.delete(i) : st.mark.add(i); jkRender(); });
  on('#jkchk1', () => {
    const t = new Set(st.lines1.map((l, i) => l[3] ? i : -1).filter(i => i >= 0));
    const missing = [...t].some(i => !st.mark.has(i)), extra = [...st.mark].some(i => !t.has(i));
    st.fb1 = { ok: !missing && !extra, missing, extra }; if (!st.fb1.ok) miss(); jkRender();
  });
  document.querySelectorAll('.jk-chip[data-g]').forEach(b => b.onclick = () => { const g = b.dataset.g, i = +b.dataset.i; st.fb2 = null; st.ev[g].has(i) ? st.ev[g].delete(i) : st.ev[g].add(i); jkRender(); });
  on('#jkchk2', () => {
    let wrong = false, missing = false;
    ['A', 'B'].forEach(g => p.s2[g].forEach((c, i) => { const sel = st.ev[g].has(i); if (sel && !c[1]) wrong = true; if (!sel && c[1]) missing = true; }));
    st.fb2 = { ok: !wrong && !missing, wrong, missing }; if (!st.fb2.ok) miss(); jkRender();
  });
  document.querySelectorAll('.jk-sent select').forEach(sel => sel.onchange = () => { st.fill[sel.dataset.id] = sel.value; st.fb3 = null; jkRender(); });
  on('#jkchk3', () => {
    const res = {}; let empty = false, allOk = true, si = 0;
    p.s3.parts.forEach((x, k) => { if (x[0] !== 's') return; const id = 's' + (si++), v = st.fill[id]; if (v === undefined || v === '') { empty = true; allOk = false; res[id] = false; } else { const ok = st.opts[k][+v][1]; res[id] = ok; if (!ok) allOk = false; } });
    st.fb3 = { res, empty, allOk };
    if (!allOk && !empty) miss();
    if (allOk && !JKDONE.has(p.key)) {   // はじめて完成したときだけ、記録する（1回でできたら ○、まちがいがあれば ×）
      JKDONE.add(p.key); const ok = st.mistakes === 0;
      bump(stats.unit, 'じっくり' + p.unit, ok); bump(stats.q, p.key, ok); saveStats(); checkDone('じっくり');
    }
    jkRender();
  });
  on('#jknext', () => { st.step++; window.scrollTo(0, 0); jkRender(); });
  on('#jkback', () => { st.step--; jkRender(); });
  on('#jknextp', () => { if (st.i === JIKKURI.length - 1) jkList(); else jkStart(st.i + 1); });
  on('#jkagain', () => jkStart(st.i));
  on('#jkquit', jkList);
  on('#jkskip', () => { if (st.i === JIKKURI.length - 1) jkList(); else jkStart(st.i + 1); });
}
/* ---------- 新しいバージョンの自動チェック（タブを開きっぱなしの端末向け） ----------
   index.html の Last-Modified / ETag が、読みこみ時から変わったら更新する。ホーム画面なら自動で再読みこみ、問題の途中ならボタンを出す */
const upd = { base: null, notified: false };
async function deploySig() {
  try {
    const r = await fetch('index.html', { method: 'HEAD', cache: 'no-store' });
    if (!r.ok) return null;
    return (r.headers.get('last-modified') || '') + '|' + (r.headers.get('etag') || '');
  } catch (e) { return null; }   // オフラインなどのときは何もしない
}
async function checkForUpdate() {
  if (upd.notified) return;
  const sig = await deploySig();
  if (!sig || sig === '|') return;
  if (upd.base === null) { upd.base = sig; return; }
  if (sig === upd.base) return;
  upd.notified = true;
  if (document.querySelector('.homewrap')) { location.reload(); return; }   // 問題の途中では、勝手に再読みこみしない
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.innerHTML = '<span>🆕 新しいバージョンがあるよ！</span><button type="button">いま更新する</button>';
  bar.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(bar);
}
document.addEventListener('click', e => { if (e.target.id === 'tmoff') { e.preventDefault(); teacher(); } });   // 「オフにする」→ 先生用メニューへ
checkForUpdate();
setInterval(checkForUpdate, 3 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);

if (location.hash === '#teacher') teacher(); else home();
</script>
